name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default 1.100.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }
      - name: Validate
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          cargo check --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Workspace check failed.' }
      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          $compiler = & .\packaging\Get-InnoSetup.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'innosetup')
          & .\packaging\Build-Release.ps1 -InnoCompiler $compiler
      - name: Smoke-test installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\target\dist\*-setup.exe
          $zip = Get-ChildItem .\target\dist\*.zip
          & .\packaging\Test-Installer.ps1 -Installer $installer.FullName -PortableZip $zip.FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            target/dist/*-setup.exe
            target/dist/*.zip
            target/dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          version="${RELEASE_TAG#v}"
          options=()
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "ADraw $version" \
            --generate-notes --notes "Windows 10/11: download the x64 setup installer, or extract the portable ZIP and run adraw.exe. Builds are not code-signed; SHA-256 checksums are included. Imported fonts and preferences are preserved by upgrades and uninstall." \
            "${options[@]}" ./*-setup.exe ./*.zip SHA256SUMS.txt
