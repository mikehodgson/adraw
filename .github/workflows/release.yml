name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for directory in release/release-*; do
            (cd "$directory" && sha256sum --check SHA256SUMS.txt)
          done
          mkdir publish
          cat release/release-*/SHA256SUMS.txt > publish/SHA256SUMS.txt
          find release -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} publish/ \;
          cd publish
          sha256sum --check SHA256SUMS.txt
          version="${RELEASE_TAG#v}"
          options=()
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "ADraw $version" \
            --generate-notes --notes "Windows x64: use the installer or portable ZIP. Linux x64/ARM64: extract the matching tar.gz and run adraw (Ubuntu 22.04 or compatible newer desktop required). macOS Intel/Apple Silicon: extract the matching tar.gz and move ADraw.app to Applications (macOS 11 or newer). Builds are not publisher-signed or notarized; macOS bundles have an ad-hoc signature only. SHA-256 checksums are included. See the bundled user guide for dependencies and platform security prompts." \
            "${options[@]}" ./*-setup.exe ./*.zip ./*.tar.gz SHA256SUMS.txt
