[package]
name = "adraw"
version.workspace = true
edition.workspace = true
license = "MIT AND CC-BY-SA-4.0"

[dependencies]
ansi_core = { path = "../ansi_core" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "persistence", "wayland", "web_screen_reader", "wgpu", "x11"] }
egui_material_icons = "0.9"
rfd = "0.18"
tempfile = "3"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
semver = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Keep Wayland client-side decorations and dynamic library loading.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita", "wayland-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL"] }

[build-dependencies]
winresource = "0.1"

